name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Vérifier que le serveur démarre
        working-directory: backend
        run: |
          cp .env.example .env
          timeout 5 node src/server.js || code=$?; if [ "$code" -ne 124 ]; then exit 1; fi

  secret-scan:
    name: Détection de secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analyse statique du code (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/nodejsscan
            p/secrets

  dependency-scan:
    name: Scan des dépendances vulnérables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit
        working-directory: backend
        run: |
          npm install
          npm audit --audit-level=high

  definition-of-done:
    name: Definition of Done — Synthèse
    runs-on: ubuntu-latest
    needs: [build, secret-scan, sast, dependency-scan]
    steps:
      - name: Tous les contrôles sont passés
        run: echo "✅ Build, SAST, détection de secrets et scan de dépendances validés."
